<h2 th:text="${product.name} + ' 상세'">상품 상세</h2>

<h3>옵션 목록</h3>
<table>
    <thead>
    <tr>
        <th>옵션 이름</th>
        <th>수량</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="option : ${options}">
        <td th:text="${option.name}">옵션명</td>
        <td th:text="${option.quantity}">100</td>
    </tr>
    </tbody>
</table>

<h3>옵션 추가</h3>
<form th:action="@{/admin/products/{productId}/options(productId=${product.id})}"
      method="post">
    <input type="text"
           name="name"
           placeholder="옵션 이름"
           required
    />
    <input type="number"
           name="quantity"
           placeholder="수량"
           min="1"
           required
    />
    <button type="submit">옵션 추가</button>
</form>
